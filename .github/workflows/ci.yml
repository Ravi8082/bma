name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      TEST_DB_PROVIDER: testcontainers
      TEST_BOOTSTRAP_DATABASE_URL: postgres://postgres:postgres@localhost:55432/postgres
      BMA_APP_PASSWORD: dev-app-password
      BMA_MIGRATOR_PASSWORD: dev-migrator-password
      BMA_REPORTING_PASSWORD: dev-reporting-password
      NODE_ENV: test
      LOG_LEVEL: silent
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests (shared money engine)
        run: npm run test --workspace @bma/shared

      - name: Tenant context check
        run: npm run check:tenant --workspace @bma/backend

      - name: Database catalog tests
        run: npm run test:catalog --workspace @bma/backend

      - name: Integration tests (PostgreSQL via Testcontainers)
        run: npm run test --workspace @bma/backend

      - name: Build all workspaces
        run: npm run build

  build:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
