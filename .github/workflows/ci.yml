name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests (shared money engine)
        run: npm run test --workspace @bma/shared

      - name: Integration tests (replica-set MongoDB)
        run: npm run test --workspace @bma/backend
        env:
          NODE_ENV: test
          MONGODB_URI: "" # forces mongodb-memory-server
          LOG_LEVEL: silent

  build:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build all workspaces
        run: npm run build
